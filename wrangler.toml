name = "mytv"
main = ".open-next/worker.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

# 默认的 workers.dev 入口（mytv.soldors1.workers.dev）必须保留：
# 显式声明防止 routes 配置出现时 deploy 关掉该触发器
workers_dev = true

# 自定义域名（workers.dev 被 SNI 封锁后的国内可达入口）：
# 前置条件 —— mytvverse.xyz 已在 Cloudflare 账号添加为 zone 且 NS 已从注册商迁入并激活。
# custom_domain 由 Workers 自动建 DNS 记录并签发证书，无需手工加 A/CNAME。
routes = [
  { pattern = "mytvverse.xyz", custom_domain = true },
  { pattern = "www.mytvverse.xyz", custom_domain = true },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_SITE_NAME = "MyTV"
# 预置采集源（M2 前台默认源；M4 后台交付后可在界面增删）
# 格式与上游 LibreTV 一致：[{name, url, detail?, isAdult?}]
DEFAULT_SOURCES = '[{"name":"量子资源","url":"https://cj.lziapi.com/api.php/provide/vod"}]'
# 预置直播源（M5）：[{name, url(M3U), epg?(XMLTV，支持 .gz)}]
DEFAULT_LIVE_SOURCES = '[{"name":"iptv-org 中国","url":"https://iptv-org.github.io/iptv/countries/cn.m3u"}]'
# 热榜数据源（60s API，自部署实例：/tmp/60s → 60s.soldors1.workers.dev，2026-09-29）
# 周榜/热搜回退用；不设则走社区实例 60s.crystelf.top → 官方 60s.viki.moe 逐级回退
60S_API_BASE = "https://60s.soldors1.workers.dev"

# M1（D1 数据层）已启用：本地状态在 .wrangler/state，远程已建库
[[d1_databases]]
binding = "DB"
database_name = "mytv-db"
database_id = "c779fce0-b6ee-4827-a58d-d02416126f4e"
migrations_dir = "migrations"

# M3（KV 缓存）已启用：搜索/详情热数据缓存 + 熔断状态不落 KV（isolate 内存）
[[kv_namespaces]]
binding = "KV"
id = "abf7efb92b754675b4656438a3d9c4f2"
